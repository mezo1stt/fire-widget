<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire Widget</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@900&family=Tajawal:wght@900&family=Almarai:wght@800&family=Changa:wght@800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            background: transparent !important;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cairo', 'Segoe UI', sans-serif;
        }

        .widget-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background: transparent !important;
        }

        .fire-text-wrapper {
            position: relative;
            display: inline-block;
        }

        .fire-text {
            font-weight: 900;
            letter-spacing: 2px;
            text-align: center;
            white-space: nowrap;
            display: inline-block;
            transition: opacity 1s ease, transform 1s ease;
            will-change: opacity, transform, text-shadow, filter;
        }

        @keyframes redPulse {
            0%, 100% {
                transform: scale(1);
                filter: brightness(1);
            }
            50% {
                transform: scale(1.02);
                filter: brightness(1.2);
            }
        }
    </style>
</head>
<body class="fire-widget-body">

    <div class="widget-container" id="widgetContainer">
        <div class="fire-text-wrapper" id="textWrapper">
            <div class="fire-text" id="fireText">رابط الدعم بالبايو</div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        let uid = params.get('uid');

        let settings = {
            text: 'رابط الدعم بالبايو',
            color: '#A00000',
            shine_color: '#FF3333',
            font_size: 56,
            shine_speed: 4,
            font_family: 'Cairo',
            widget_type: 'both',
            direction: 'right-left',
            intro_duration: 3.0,
            hold_duration: 2.0,
            outro_duration: 3.0,
            shadow_strength: 30,
            neon_enabled: 0,
            neon_strength: 80,
            intro_style: 'fade',
            outro_style: 'fade'
        };

        const textEl = document.getElementById('fireText');

        if (!uid) {
            fetch('/api/device-board')
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        uid = data.board_id;
                        loadSettings();
                    }
                });
        } else {
            loadSettings();
        }

        async function loadSettings() {
            try {
                const res = await fetch('/api/fire-settings/' + uid + '?t=' + Date.now());
                const data = await res.json();
                if (data.success) {
                    settings = { ...settings, ...data.settings };
                    applySettings();
                }
            } catch (err) {}
        }

        // =========================
        // APPLY BASE STYLES
        // =========================
        function applySettings() {
            textEl.textContent = settings.text;
            textEl.style.fontFamily = `'${settings.font_family}', sans-serif`;
            textEl.style.fontSize = settings.font_size + 'px';
            textEl.style.fontWeight = '900';
            textEl.style.letterSpacing = '2px';
            textEl.style.color = settings.color;
            textEl.style.background = 'none';
            textEl.style.webkitTextFillColor = settings.color;
            textEl.style.backgroundClip = 'initial';
            textEl.style.webkitBackgroundClip = 'initial';

            // Glow أحمر (3 طبقات)
            const glowIntensity = settings.neon_enabled ? settings.neon_strength / 100 : 0.8;
            const blur1 = settings.font_size * 0.15 * glowIntensity;
            const blur2 = settings.font_size * 0.35 * glowIntensity;
            const blur3 = settings.font_size * 0.6 * glowIntensity;

            textEl.style.textShadow = `
                0 0 ${blur1}px ${settings.shine_color},
                0 0 ${blur2}px ${settings.color},
                0 0 ${blur3}px ${settings.color}
            `;

            textEl.style.filter = `drop-shadow(0 0 8px ${settings.color}aa) brightness(1.1)`;
        }

        // =========================
        // CYCLE (Intro → Hold → Outro)
        // =========================
        function startCycle() {
            function runCycle() {
                const introDur = (settings.intro_duration || 3) * 1000;
                const holdDur = (settings.hold_duration || 2) * 1000;
                const outroDur = (settings.outro_duration || 3) * 1000;

                // RESET
                textEl.style.transition = 'none';
                textEl.style.animation = 'none';
                textEl.style.opacity = '0';
                textEl.style.transform = 'scale(0.9)';
                textEl.style.filter = `drop-shadow(0 0 8px ${settings.color}aa) brightness(1.1) blur(8px)`;

                // INTRO — Fade In + Scale + un-blur
                setTimeout(() => {
                    textEl.style.transition = `opacity ${introDur}ms ease-out, transform ${introDur}ms ease-out, filter ${introDur}ms ease-out`;
                    textEl.style.opacity = '1';
                    textEl.style.transform = 'scale(1)';
                    textEl.style.filter = `drop-shadow(0 0 8px ${settings.color}aa) brightness(1.1) blur(0px)`;
                }, 100);

                // HOLD — Pulse
                setTimeout(() => {
                    textEl.style.animation = 'redPulse 2s ease-in-out infinite';
                }, 100 + introDur);

                // OUTRO — Fade Out + Scale
                setTimeout(() => {
                    textEl.style.animation = 'none';
                    textEl.style.transition = `opacity ${outroDur}ms ease-in, transform ${outroDur}ms ease-in, filter ${outroDur}ms ease-in`;
                    textEl.style.opacity = '0';
                    textEl.style.transform = 'scale(1.05)';
                    textEl.style.filter = `drop-shadow(0 0 20px ${settings.color}aa) brightness(1.3) blur(4px)`;
                }, 100 + introDur + holdDur);

                // RESTART
                setTimeout(() => {
                    runCycle();
                }, 100 + introDur + holdDur + outroDur + 500);
            }

            runCycle();
        }

        // BOOT
        setTimeout(() => {
            applySettings();
            startCycle();
        }, 300);

        setInterval(loadSettings, 2000);
    </script>
</body>
</html>
