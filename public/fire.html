<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire Widget — Settings</title>
    <link rel="stylesheet" href="/css/fire.css">
</head>
<body class="fire-settings-body">

    <div class="settings-container">
        <h1>🔥 إعدادات Fire Widget</h1>

        <div class="settings-box">

            <div class="input-group">
                <label>النص</label>
                <input type="text" id="textInput" value="رابط الدعم بالبايو" maxlength="60" placeholder="اكتب النص...">
            </div>

            <div class="input-group">
                <label>لون النص</label>
                <div class="color-row">
                    <input type="color" id="colorInput" value="#A00000">
                    <input type="text" id="colorHex" value="#A00000" maxlength="7">
                </div>
            </div>

            <div class="input-group">
                <label>لون اللمعان (Glow)</label>
                <div class="color-row">
                    <input type="color" id="shineInput" value="#FF3333">
                    <input type="text" id="shineHex" value="#FF3333" maxlength="7">
                </div>
            </div>

            <div class="input-group">
                <label>الخط</label>
                <select id="fontInput" class="select-input">
                    <option value="Cairo">Cairo (افتراضي)</option>
                    <option value="Tajawal">Tajawal</option>
                    <option value="Almarai">Almarai</option>
                    <option value="Changa">Changa</option>
                    <option value="Arial">Arial</option>
                    <option value="Impact">Impact</option>
                    <option value="Comic Sans MS">Comic Sans MS</option>
                    <option value="Georgia">Georgia</option>
                    <option value="Verdana">Verdana</option>
                    <option value="Courier New">Courier New</option>
                </select>
            </div>

            <div class="input-group">
                <label>حجم الخط</label>
                <div class="size-row">
                    <input type="range" id="sizeInput" min="20" max="120" value="56">
                    <span id="sizeValue">56px</span>
                </div>
            </div>

            <div class="input-group">
                <label>قوة الظل (Shadow)</label>
                <div class="size-row">
                    <input type="range" id="shadowInput" min="0" max="100" value="30">
                    <span id="shadowValue">30%</span>
                </div>
            </div>

            <div class="input-group">
                <label>تشغيل النيون (Neon Glow)</label>
                <div class="style-row">
                    <button class="style-btn neon-btn active" data-neon="0">إيقاف</button>
                    <button class="style-btn neon-btn" data-neon="1">تشغيل</button>
                </div>
            </div>

            <div class="input-group">
                <label>قوة النيون</label>
                <div class="size-row">
                    <input type="range" id="neonInput" min="0" max="100" value="80">
                    <span id="neonValue">80%</span>
                </div>
            </div>

            <div class="input-group">
                <label>مدة الظهور (Intro)</label>
                <div class="size-row">
                    <input type="range" id="introInput" min="1" max="6" step="0.5" value="3">
                    <span id="introValue">3s</span>
                </div>
            </div>

            <div class="input-group">
                <label>مدة الانتظار (Hold)</label>
                <div class="size-row">
                    <input type="range" id="holdInput" min="0.5" max="5" step="0.5" value="2">
                    <span id="holdValue">2s</span>
                </div>
            </div>

            <div class="input-group">
                <label>مدة الاختفاء (Outro)</label>
                <div class="size-row">
                    <input type="range" id="outroInput" min="1" max="6" step="0.5" value="3">
                    <span id="outroValue">3s</span>
                </div>
            </div>

            <div class="input-group">
                <label>معاينة</label>
                <div class="preview-box">
                    <div id="previewText" class="preview-text">رابط الدعم بالبايو</div>
                </div>
            </div>

            <div class="buttons">
                <button class="btn-save" id="saveBtn">💾 حفظ</button>
                <button class="btn-copy" id="copyBtn">📋 نسخ رابط الـ Widget</button>
                <button class="btn-preview" id="previewBtn">👁️ معاينة</button>
            </div>

            <div class="status" id="status"></div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        let uid = params.get('uid');

        if (!uid) {
            fetch('/api/device-board')
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        uid = data.board_id;
                        loadSettings();
                    }
                });
        } else {
            loadSettings();
        }

        async function loadSettings() {
            try {
                const res = await fetch('/api/fire-settings/' + uid);
                const data = await res.json();

                if (data.success) {
                    const s = data.settings;
                    document.getElementById('textInput').value = s.text;
                    document.getElementById('colorInput').value = s.color;
                    document.getElementById('colorHex').value = s.color;
                    document.getElementById('shineInput').value = s.shine_color;
                    document.getElementById('shineHex').value = s.shine_color;
                    document.getElementById('fontInput').value = s.font_family || 'Cairo';
                    document.getElementById('sizeInput').value = s.font_size;
                    document.getElementById('sizeValue').textContent = s.font_size + 'px';

                    document.getElementById('shadowInput').value = s.shadow_strength ?? 30;
                    document.getElementById('shadowValue').textContent = (s.shadow_strength ?? 30) + '%';

                    document.getElementById('neonInput').value = s.neon_strength ?? 80;
                    document.getElementById('neonValue').textContent = (s.neon_strength ?? 80) + '%';

                    document.getElementById('introInput').value = s.intro_duration || 3;
                    document.getElementById('introValue').textContent = (s.intro_duration || 3) + 's';

                    document.getElementById('holdInput').value = s.hold_duration || 2;
                    document.getElementById('holdValue').textContent = (s.hold_duration || 2) + 's';

                    document.getElementById('outroInput').value = s.outro_duration || 3;
                    document.getElementById('outroValue').textContent = (s.outro_duration || 3) + 's';

                    document.querySelectorAll('.neon-btn').forEach(b => {
                        b.classList.toggle('active', b.dataset.neon === String(s.neon_enabled ? 1 : 0));
                    });

                    updatePreview();
                }
            } catch (err) {}
        }

        document.getElementById('saveBtn').addEventListener('click', async () => {
            const text = document.getElementById('textInput').value;
            const color = document.getElementById('colorInput').value;
            const shine_color = document.getElementById('shineInput').value;
            const font_family = document.getElementById('fontInput').value;
            const font_size = parseInt(document.getElementById('sizeInput').value);
            const intro_duration = parseFloat(document.getElementById('introInput').value);
            const hold_duration = parseFloat(document.getElementById('holdInput').value);
            const outro_duration = parseFloat(document.getElementById('outroInput').value);
            const shadow_strength = parseInt(document.getElementById('shadowInput').value);
            const neon_enabled = document.querySelector('.neon-btn.active').dataset.neon === '1';
            const neon_strength = parseInt(document.getElementById('neonInput').value);

            // ثابت
            const widget_type = 'both';
            const direction = 'right-left';
            const intro_style = 'fade';
            const outro_style = 'fade';
            const shine_speed = 4;

            try {
                await fetch('/api/fire-settings/' + uid, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        text, color, shine_color, font_size, shine_speed, font_family, widget_type,
                        direction, intro_duration, hold_duration, outro_duration,
                        shadow_strength, neon_enabled, neon_strength, intro_style, outro_style
                    })
                });
                showStatus('✅ تم الحفظ', 'success');
            } catch (err) {
                showStatus('❌ فشل الحفظ', 'error');
            }
        });

        document.getElementById('copyBtn').addEventListener('click', () => {
            const url = window.location.origin + '/fire-widget.html?uid=' + uid;
            navigator.clipboard.writeText(url).then(() => showStatus('✅ تم نسخ الرابط', 'success'));
        });

        document.getElementById('previewBtn').addEventListener('click', () => {
            window.open('/fire-widget.html?uid=' + uid, '_blank');
        });

        // Live inputs
        ['colorInput', 'shineInput', 'sizeInput', 'fontInput', 'textInput',
         'shadowInput', 'neonInput'].forEach(id => {
            document.getElementById(id).addEventListener('input', () => {
                if (id === 'colorInput') document.getElementById('colorHex').value = document.getElementById('colorInput').value;
                if (id === 'shineInput') document.getElementById('shineHex').value = document.getElementById('shineInput').value;
                if (id === 'sizeInput') document.getElementById('sizeValue').textContent = document.getElementById('sizeInput').value + 'px';
                if (id === 'shadowInput') document.getElementById('shadowValue').textContent = document.getElementById('shadowInput').value + '%';
                if (id === 'neonInput') document.getElementById('neonValue').textContent = document.getElementById('neonInput').value + '%';
                updatePreview();
            });
        });

        document.getElementById('colorHex').addEventListener('input', e => {
            if (/^#[0-9A-Fa-f]{6}$/.test(e.target.value)) {
                document.getElementById('colorInput').value = e.target.value;
                updatePreview();
            }
        });
        document.getElementById('shineHex').addEventListener('input', e => {
            if (/^#[0-9A-Fa-f]{6}$/.test(e.target.value)) {
                document.getElementById('shineInput').value = e.target.value;
                updatePreview();
            }
        });

        ['introInput', 'holdInput', 'outroInput'].forEach(id => {
            document.getElementById(id).addEventListener('input', () => {
                const map = { introInput: 'introValue', holdInput: 'holdValue', outroInput: 'outroValue' };
                document.getElementById(map[id]).textContent = document.getElementById(id).value + 's';
            });
        });

        document.querySelectorAll('.neon-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.neon-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                updatePreview();
            });
        });

        function updatePreview() {
            const text = document.getElementById('textInput').value;
            const color = document.getElementById('colorInput').value;
            const size = document.getElementById('sizeInput').value;
            const font = document.getElementById('fontInput').value;
            const shadow = parseInt(document.getElementById('shadowInput').value);
            const neonOn = document.querySelector('.neon-btn.active').dataset.neon === '1';
            const neonStr = parseInt(document.getElementById('neonInput').value);

            const preview = document.getElementById('previewText');
            preview.textContent = text;
            preview.style.fontFamily = `'${font}', sans-serif`;
            preview.style.fontSize = size + 'px';
            preview.style.color = color;
            preview.style.background = 'none';
            preview.style.webkitTextFillColor = color;
            preview.style.backgroundClip = 'initial';
            preview.style.webkitBackgroundClip = 'initial';
            preview.style.fontWeight = '900';

            const glowIntensity = neonOn ? neonStr / 100 : 0.8;
            const blur1 = size * 0.15 * glowIntensity;
            const blur2 = size * 0.35 * glowIntensity;
            const blur3 = size * 0.6 * glowIntensity;

            preview.style.textShadow = `
                0 0 ${blur1}px ${color},
                0 0 ${blur2}px ${color},
                0 0 ${blur3}px ${color}
            `;
            preview.style.filter = `drop-shadow(0 0 8px ${color}aa) brightness(1.1)`;
        }

        function showStatus(msg, type) {
            const status = document.getElementById('status');
            status.textContent = msg;
            status.className = 'status ' + type;
            setTimeout(() => {
                status.textContent = '';
                status.className = 'status';
            }, 3000);
        }
    </script>
</body>
</html>
